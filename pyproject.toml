[project]
name = "refusal-neuron-ru"
version = "0.2.0"
description = "Reproduce single-neuron steering of Qwen3.5-4B on CPU"
requires-python = "==3.12.*"
license = "MIT"
dependencies = [
    "torch==2.14.1",
    "transformers==5.20.2",
    "huggingface-hub==2.3.0",
    "safetensors==0.8.0",
    "tokenizers==0.23.3",
    "numpy",
]

[dependency-groups]
# Extra deps of llama.cpp's convert_hf_to_gguf.py (it imports gguf from its own gguf-py tree).
convert = ["sentencepiece", "protobuf", "pyyaml", "tqdm", "requests"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
